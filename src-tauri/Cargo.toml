[package]
name = "rpstr"
version = "0.1.0"
description = "Asystent psychiatry — lokalne podsumowania wizyt"
authors = ["cermmid"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rpstr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
pbkdf2 = "0.12"
hmac = "0.12"
rand = "0.8"
dirs = "5"

# D3: nagrywanie audio (cpal) — opcjonalne, włączane flagą.
# Na Linux wymaga libasound2-dev, na Windows/Mac bez dodatkowych deps.
cpal = { version = "0.15", optional = true }

# D4: transkrypcja (whisper-rs) — opcjonalne, wymaga clang + cmake do zbudowania
# whisper.cpp. Na Windowsie zalecana wersja z `cuda` albo `metal` feature dla GPU.
whisper-rs = { version = "0.13", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
# Włącz nagrywanie przez cpal. Bez tego start/stop_recording zwracają stuby.
audio-live = ["dep:cpal"]
# Włącz lokalną transkrypcję whisper-rs. Bez tego transcribe zwraca placeholder.
stt-whisper = ["dep:whisper-rs"]
# Full stack dla developera (Windows/Mac): `cargo tauri dev --features full`.
full = ["audio-live", "stt-whisper"]
